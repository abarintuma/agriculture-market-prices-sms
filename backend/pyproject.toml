[project]
name = "backend"
version = "0.1.0"
description = "Agri-Market SMS API"
readme = "README.md"
authors = [
    { name = "Aaine Barintuma", email = "abarintuma@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.13",
    "httpx>=0.28.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "twilio>=9.10.9",
    "uvicorn>=0.52.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
